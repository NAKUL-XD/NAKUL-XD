<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Nakul Yadav - Full-Stack Developer, GenAI and Agentic AI Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e75b6"/>
      <stop offset="50%" stop-color="#6a5acd"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="280" rx="18"/></clipPath>
    <style>
      .name{font:800 62px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:1px}
      .sub{font:500 20px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8e6ff;letter-spacing:2px}
      .line{font:600 22px 'Fira Code','Courier New',monospace;fill:#fff;opacity:0;animation:cycle 16s infinite}
      .l1{animation-delay:0s}.l2{animation-delay:4s}.l3{animation-delay:8s}.l4{animation-delay:12s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- floating particles -->
    <g fill="#fff" opacity=".35">
      <circle cx="90" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="210" r="2"><animate attributeName="cy" values="210;190;210" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="40" r="2.5"><animate attributeName="cy" values="40;60;40" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="70" r="3"><animate attributeName="cy" values="70;50;70" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="190" r="2"><animate attributeName="cy" values="190;170;190" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="150" r="1.8"><animate attributeName="cy" values="150;135;150" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <text class="name" x="500" y="105" text-anchor="middle">Nakul Yadav</text>
    <text class="sub" x="500" y="142" text-anchor="middle">FULL-STACK DEVELOPER · GENAI &amp; AGENTIC AI BUILDER</text>

    <!-- cycling lines -->
    <g text-anchor="middle">
      <text class="line l1" x="500" y="192">&gt; Building a multi-platform AI agent_</text>
      <text class="line l2" x="500" y="192">&gt; Real-time apps with React + Socket.io_</text>
      <text class="line l3" x="500" y="192">&gt; Learning RAG · LangChain · LangGraph_</text>
      <text class="line l4" x="500" y="192">&gt; AI/ML &amp; Data Science enthusiast_</text>
    </g>

    <!-- animated waves -->
    <path fill="#ffffff" fill-opacity=".12" d="M0 232 Q125 198 250 232 T500 232 T750 232 T1000 232 T1250 232 T1500 232 T1750 232 T2000 232 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffffff" fill-opacity=".18" d="M0 246 Q125 222 250 246 T500 246 T750 246 T1000 246 T1250 246 T1500 246 T1750 246 T2000 246 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="#0d1117" fill-opacity=".35" d="M0 262 Q125 244 250 262 T500 262 T750 262 T1000 262 T1250 262 T1500 262 T1750 262 T2000 262 V280 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
