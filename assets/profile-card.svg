<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Nakul Yadav profile card">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e75b6"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e75b6"/>
      <stop offset="50%" stop-color="#6a5acd"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <style>
      .t{font:700 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc}
      .r{font:500 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9da7b3;letter-spacing:.5px}
      .m{font:800 40px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
      .chip{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9}
      .st{font:500 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee787}
      .pulse{transform-origin:170px 78px;animation:pulse 2.6s ease-out infinite}
      @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
      .dot{animation:dot 1.6s ease-in-out infinite}
      @keyframes dot{50%{opacity:.3}}
    </style>
  </defs>

  <rect x="2" y="2" width="336" height="296" rx="18" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>

  <!-- avatar -->
  <circle class="pulse" cx="170" cy="78" r="42" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="170" cy="78" r="42" fill="url(#ring)"/>
  <text class="m" x="170" y="92" text-anchor="middle">NY</text>

  <!-- identity -->
  <text class="t" x="170" y="150" text-anchor="middle">Nakul Yadav</text>
  <text class="r" x="170" y="172" text-anchor="middle">@nakul-xd · Full-Stack &amp; AI Builder</text>

  <!-- chips -->
  <g>
    <rect x="30" y="192" width="64" height="26" rx="13" fill="#161b22" stroke="#0e75b6"/>
    <text class="chip" x="62" y="209" text-anchor="middle">React</text>
    <rect x="102" y="192" width="64" height="26" rx="13" fill="#161b22" stroke="#6a5acd"/>
    <text class="chip" x="134" y="209" text-anchor="middle">Node.js</text>
    <rect x="174" y="192" width="64" height="26" rx="13" fill="#161b22" stroke="#6a5acd"/>
    <text class="chip" x="206" y="209" text-anchor="middle">Python</text>
    <rect x="246" y="192" width="64" height="26" rx="13" fill="#161b22" stroke="#8a2be2"/>
    <text class="chip" x="278" y="209" text-anchor="middle">GenAI</text>

    <rect x="58" y="226" width="78" height="26" rx="13" fill="#161b22" stroke="#8a2be2"/>
    <text class="chip" x="97" y="243" text-anchor="middle">LangGraph</text>
    <rect x="144" y="226" width="64" height="26" rx="13" fill="#161b22" stroke="#8a2be2"/>
    <text class="chip" x="176" y="243" text-anchor="middle">RAG</text>
    <rect x="216" y="226" width="68" height="26" rx="13" fill="#161b22" stroke="#0e75b6"/>
    <text class="chip" x="250" y="243" text-anchor="middle">Socket.io</text>
  </g>

  <!-- status -->
  <circle class="dot" cx="104" cy="277" r="4" fill="#3fb950"/>
  <text class="st" x="114" y="281">Building in public</text>
</svg>
